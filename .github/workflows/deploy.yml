name: deploy
on:
  push:
    branches: [master]
    paths-ignore: ["**.md", "LICENSE*", "LICENSES/**", "CHANGELOG.md", "molecule/**"]
  repository_dispatch:
    types: [tofu-applied]
  workflow_dispatch:
    inputs:
      check:
        description: Check mode (no changes)
        type: boolean
        default: false
permissions: { contents: read }
concurrency: { group: deploy, cancel-in-progress: false }
jobs:
  deploy:
    uses: sogeor/workflows/.github/workflows/ansible-deploy.yml@95450ec9900a41a9ef161879675d1851e93b2d56 # v1.3.0
    with:
      check: ${{ inputs.check == true }}
    secrets: inherit
