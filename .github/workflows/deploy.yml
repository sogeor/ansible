name: deploy
on:
  push:
    branches: [master]
    paths-ignore: ["**.md", "LICENSE*", "LICENSES/**", "CHANGELOG.md", "molecule/**"]
  repository_dispatch:
    types: [status-config, tofu-applied]
  workflow_dispatch:
    inputs:
      check:
        description: Check mode (no changes)
        type: boolean
        default: false
permissions: { contents: read }
concurrency: { group: deploy, cancel-in-progress: false }
jobs:
  deploy:
    uses: sogeor/workflows/.github/workflows/ansible-deploy.yml@478bc92e70c7890679e516fdef6032aa2643e160 # v1.3.3
    with:
      check: ${{ inputs.check == true }}
    secrets: inherit
