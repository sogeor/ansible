name: deploy
on:
  push:
    branches: [master]
    paths-ignore: ["**.md", "LICENSE*", "LICENSES/**", "CHANGELOG.md"]
  repository_dispatch:
    types: [tofu-applied]
  workflow_dispatch:
    inputs:
      check:
        description: Check mode (no changes)
        type: boolean
        default: false
permissions: { contents: read }
concurrency: { group: deploy, cancel-in-progress: false }
jobs:
  deploy:
    uses: sogeor/workflows/.github/workflows/ansible-deploy.yml@c1895bcf1f56e3c884be3d7eae763475c44d614d # v1.1.4
    with:
      check: ${{ inputs.check == true }}
    secrets: inherit
