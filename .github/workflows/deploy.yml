name: deploy
on:
  push:
    branches: [master]
    paths-ignore: ["**.md", "LICENSE*", "LICENSES/**", "CHANGELOG.md"]
  repository_dispatch:
    types: [tofu-applied]
  workflow_dispatch:
    inputs:
      check:
        description: Check mode (no changes)
        type: boolean
        default: false
permissions: { contents: read }
concurrency: { group: deploy, cancel-in-progress: false }
jobs:
  deploy:
    uses: sogeor/workflows/.github/workflows/ansible-deploy.yml@a9aab9747d736fc8486adbb25e6945f2468e2a72 # v1.3.1
    with:
      check: ${{ inputs.check == true }}
    secrets: inherit
