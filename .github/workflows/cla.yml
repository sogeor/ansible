# pull_request_target: never check out or run code from the pull request.
name: cla
on:
  issue_comment: { types: [created] }
  pull_request_target: { types: [opened, synchronize] }
permissions:
  actions: write
  contents: read
  pull-requests: write
  statuses: write
jobs:
  cla:
    if: >-
      (github.event.comment.body == 'recheck' ||
       github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') ||
      github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1
        id: app
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: sogeor
          repositories: cla
      - uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PERSONAL_ACCESS_TOKEN: ${{ steps.app.outputs.token }}
        with:
          path-to-document: https://github.com/sogeor/.github/blob/HEAD/CLA.md
          path-to-signatures: signatures/v1/cla.json
          remote-organization-name: sogeor
          remote-repository-name: cla
          branch: master
          lock-pullrequest-aftermerge: false
          allowlist: ${{ vars.CLA_ALLOWLIST }}
