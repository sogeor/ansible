---
# --- Connection (every server is bootstrapped by files/user-data.yaml or files/bootstrap.sh) ---
ansible_user: ansible
ansible_ssh_private_key_file: ~/.ssh/sogeor_ansible
ansible_ssh_common_args: >-
  -o CertificateFile=~/.ssh/sogeor_ansible-cert.pub
  -o IdentitiesOnly=yes

# --- General ---
domain: sogeor.com
ssh_port: 822
timezone: Etc/UTC

# --- Versions (Renovate preset github>sogeor/renovate:ansible) ---
k8s_minor: "v1.36"                    # Kubernetes and CRI-O minor versions are bumped by hand
k8s_pkg_version: "1.36.5-1.1"         # check: apt-cache madison kubeadm
crio_minor: "v1.36"
# renovate: datasource=docker depName=registry.k8s.io/pause
pause_image_tag: "3.10.2"
pause_image: "registry.k8s.io/pause:{{ pause_image_tag }}"
# renovate: datasource=github-releases depName=etcd-io/etcd extractVersion=^v(?<version>.+)$
etcd_tools_version: "3.6.8"
# renovate: datasource=helm depName=cilium registryUrl=https://helm.cilium.io/
cilium_version: "1.20.3"
# renovate: datasource=github-releases depName=kubernetes-sigs/gateway-api
gateway_api_version: "v1.6.3"

# --- Cluster network (guide 3.1) ---
cluster_name: sogeor
control_plane_endpoint: master.sogeor.com
cluster_cidr: 10.0.0.0/12             # whole cluster block: pod pools, services, LB
service_cidr: 10.0.0.0/16
node_private_cidr: 192.168.250.0/24
cluster_api_sans:
  - master.sogeor.com
  - odin.sogeor.com
  - 127.0.0.1
  - localhost
  - 10.0.0.1                          # ClusterIP of kubernetes.default
  - 172.20.0.1                        # odin in the admin WireGuard

# --- Firewall ---
fw_peer_nodes: []                     # other cluster nodes (guide 16)
fw_public_tcp: [80, 443]
fw_public_udp: [443]

# --- Admin WireGuard (guide 3.1.3, 10.13); wg_address comes from tofu ---
wg_allowed_tcp: [822, 6443]
wg_network: 172.20.0.0/20
wg_peers:
  - name: workstation
    address: 172.20.2.1
    public_key: "WORKSTATION_PUBLIC_KEY"
wg_port: 51820

# --- Flux ---
fleet_checkout: /root/fleet
fleet_ref: v0.1.0                     # fleet tag with Cilium values and Flux manifests for bootstrap
flux_cluster_path: clusters/odin
flux_repo_url: https://github.com/sogeor/fleet

# --- Backups ---
backup_age_recipient: age1qt3cr9zqglcm06vn3vje7ngvrdepdtvt3p3mte3ua6z05382ssmsuk66th
backup_keep_local: 28
backup_remote_min_age: 60d
backup_s3_bucket: master
backup_s3_endpoint: https://s3.twcstorage.ru
backup_s3_prefix: k8s
backup_s3_region: ru-1
backup_schedule: "*-*-* 00/6:17:00"
