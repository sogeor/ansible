# Security updates only (distribution defaults in 50unattended-upgrades), plus cleanup
# and the reboot policy of this host.
- name: Daily package lists and unattended upgrades
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    content: |
      APT::Periodic::Update-Package-Lists "1";
      APT::Periodic::Unattended-Upgrade "1";
    owner: root
    group: root
    mode: "0644"

- name: Unattended upgrades cleanup and reboot policy
  ansible.builtin.template:
    src: unattended-upgrades.j2
    dest: /etc/apt/apt.conf.d/52sogeor-unattended-upgrades
    owner: root
    group: root
    mode: "0644"

- name: Apt timer drop-in directories
  ansible.builtin.file:
    path: "/etc/systemd/system/{{ item }}.d"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - apt-daily.timer
    - apt-daily-upgrade.timer

- name: Apt timer schedules
  ansible.builtin.template:
    src: apt-timer.conf.j2
    dest: "/etc/systemd/system/{{ item.timer }}.d/50-sogeor.conf"
    owner: root
    group: root
    mode: "0644"
  loop:
    - { timer: apt-daily.timer, time: "{{ base_apt_update_time }}" }
    - { timer: apt-daily-upgrade.timer, time: "{{ base_upgrade_time }}" }
  loop_control:
    label: "{{ item.timer }}"
  notify: Restart apt timers
