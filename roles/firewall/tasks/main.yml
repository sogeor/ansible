# A new ruleset is loaded with a rollback timer armed and becomes the boot configuration
# (/etc/nftables.conf) only after Ansible has reconnected through it. If the run is cut off
# or SSH is locked out, the timer restores the previous table after firewall_rollback_seconds.

- name: Preview boot configuration
  ansible.builtin.template:
    src: nftables.conf.j2
    dest: /etc/nftables.conf
    owner: root
    group: root
    mode: "0755"
  check_mode: true
  register: firewall_preview
  tags: [firewall]

- name: State directory
  ansible.builtin.file:
    path: "{{ firewall_state_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0700"
  tags: [firewall]

- name: Candidate ruleset
  ansible.builtin.template:
    src: nftables.conf.j2
    dest: "{{ firewall_state_dir }}/nftables.conf.new"
    owner: root
    group: root
    mode: "0600"
    validate: nft -c -f %s
  tags: [firewall]

- name: Apply ruleset with automatic rollback
  ansible.builtin.include_tasks:
    file: apply.yml
    apply:
      tags: [firewall]
  when: firewall_preview is changed and not ansible_check_mode
  tags: [firewall]

- name: Nftables loads the ruleset at boot
  ansible.builtin.systemd_service:
    name: nftables
    enabled: true
  tags: [firewall]
