# Checks that hold for every server; each role adds its own checks here.
- name: Verify
  hosts: all
  gather_facts: true
  tasks:
    - name: Distribution matches the server
      ansible.builtin.assert:
        that: >-
          (inventory_hostname == 'odin' and ansible_facts['distribution'] == 'Debian' and ansible_facts['distribution_major_version'] == '13')
          or (inventory_hostname == 'zelda' and ansible_facts['distribution'] == 'Ubuntu' and ansible_facts['distribution_version'] == '24.04')
        quiet: true

    - name: Systemd is PID 1
      ansible.builtin.assert:
        that: ansible_facts['service_mgr'] == 'systemd'
        quiet: true

    # --- role base ---
    - name: Installed packages
      ansible.builtin.package_facts:

    - name: Base packages are installed
      ansible.builtin.assert:
        that: item in ansible_facts['packages']
        quiet: true
      loop: [chrony, jq, needrestart, nftables, tzdata, unattended-upgrades]

    - name: Hardware packages only on odin
      ansible.builtin.assert:
        that: ('smartmontools' in ansible_facts['packages']) == (inventory_hostname == 'odin')
        quiet: true

    - name: Read apt and system configuration
      ansible.builtin.slurp:
        src: "{{ item }}"
      register: verify_files
      loop:
        - "/etc/apt/sources.list.d/{{ 'debian' if inventory_hostname == 'odin' else 'ubuntu' }}.sources"
        - /etc/systemd/journald.conf.d/50-sogeor.conf
        - /etc/apt/apt.conf.d/52sogeor-unattended-upgrades
        - /etc/needrestart/conf.d/50-sogeor.conf
        - /etc/timezone

    - name: Configuration content
      vars:
        verify_content: "{{ verify_files.results | map(attribute='content') | map('b64decode') | list }}"
      ansible.builtin.assert:
        that:
          - "'security' in verify_content[0]"
          - "'Signed-By:' in verify_content[0]"
          - "'deb-src' not in verify_content[0]"
          - inventory_hostname != 'odin' or 'non-free-firmware' in verify_content[0]
          - inventory_hostname != 'zelda' or 'archive.ubuntu.com' in verify_content[0]
          - "('SystemMaxUse=2G' if inventory_hostname == 'odin' else 'SystemMaxUse=200M') in verify_content[1]"
          - "('Automatic-Reboot \"true\"' if inventory_hostname == 'zelda' else 'Automatic-Reboot \"false\"') in verify_content[2]"
          - "\"$nrconf{restart} = 'l';\" in verify_content[3]"
          - verify_content[4] | trim == 'Etc/UTC'
        quiet: true

    - name: Provider mirror list is gone
      ansible.builtin.stat:
        path: /etc/apt/sources.list.d/mirrors.sources
      register: verify_mirrors

    - name: No provider mirror list
      ansible.builtin.assert:
        that: not verify_mirrors.stat.exists
        quiet: true

    - name: Local time is UTC
      ansible.builtin.stat:
        path: /etc/localtime
      register: verify_localtime

    - name: Localtime points to Etc/UTC
      ansible.builtin.assert:
        that: verify_localtime.stat.lnk_source is search('zoneinfo/Etc/UTC$')
        quiet: true

    - name: Apt timer drop-ins
      ansible.builtin.slurp:
        src: "/etc/systemd/system/{{ item }}.d/50-sogeor.conf"
      register: verify_timers
      loop: [apt-daily.timer, apt-daily-upgrade.timer]

    - name: Package lists at 23:00 and upgrades at 00:00 UTC
      ansible.builtin.assert:
        that:
          - "'OnCalendar=*-*-* 23:00' in (verify_timers.results[0].content | b64decode)"
          - "'OnCalendar=*-*-* 00:00' in (verify_timers.results[1].content | b64decode)"
        quiet: true

    # --- role firewall ---
    - name: Active table inet host
      ansible.builtin.command:
        cmd: nft list table inet host
      register: verify_nft
      changed_when: false

    - name: Only SSH, WireGuard and the status page are open, nothing is forwarded
      ansible.builtin.assert:
        that:
          - "'policy drop' in verify_nft.stdout"
          - "'tcp dport 822 accept' in verify_nft.stdout"
          - "'udp dport 51820 accept' in verify_nft.stdout"
          - "'@ssh_meter4' in verify_nft.stdout"
          - "'limit rate over 30/minute burst 60 packets' in verify_nft.stdout"
          # The admin tunnel is accepted before the SSH rate limit applies
          - verify_nft.stdout.find('iifname "wg0"') < verify_nft.stdout.find('@ssh_meter4 {')
          - "'chain forward' in verify_nft.stdout"
          - "'iifname \"wg0\" ip saddr 172.20.0.0/20 tcp dport { 822, 6443 } accept' in verify_nft.stdout"
          - "('tcp dport { 80, 443 } accept' in verify_nft.stdout) == (inventory_hostname == 'zelda')"
        quiet: true

    - name: No Debian accept-all table
      ansible.builtin.command:
        cmd: nft list tables
      register: verify_tables
      changed_when: false

    - name: Only table inet host
      ansible.builtin.assert:
        that: "'table inet filter' not in verify_tables.stdout"
        quiet: true

    - name: Boot configuration is the applied ruleset
      ansible.builtin.slurp:
        src: /etc/nftables.conf
      register: verify_nft_conf

    - name: Boot configuration is managed by the firewall role
      ansible.builtin.assert:
        that: "'(role firewall)' in (verify_nft_conf.content | b64decode)"
        quiet: true

    - name: Rollback timer state # noqa: command-instead-of-module
      ansible.builtin.command:
        cmd: systemctl is-active sogeor-fw-rollback.timer
      register: verify_rollback
      changed_when: false
      failed_when: false

    - name: No rollback is pending
      ansible.builtin.assert:
        that: verify_rollback.rc != 0
        quiet: true

    # --- role wireguard ---
    - name: WireGuard configuration file
      ansible.builtin.stat:
        path: /etc/wireguard/wg0.conf
      register: verify_wg_stat

    - name: WireGuard configuration is private
      ansible.builtin.assert:
        that:
          - verify_wg_stat.stat.exists
          - verify_wg_stat.stat.mode == '0600'
        quiet: true

    - name: Read WireGuard configuration
      ansible.builtin.slurp:
        src: /etc/wireguard/wg0.conf
      register: verify_wg_conf
      no_log: true

    - name: Interface address, port and the workstation peer
      ansible.builtin.assert:
        that:
          - "('Address = ' ~ ('172.20.0.1' if inventory_hostname == 'odin' else '172.20.1.1') ~ '/20') in (verify_wg_conf.content | b64decode)"
          - "'ListenPort = 51820' in (verify_wg_conf.content | b64decode)"
          - "'AllowedIPs = 172.20.2.1/32' in (verify_wg_conf.content | b64decode)"
        quiet: true
      no_log: true

    # --- role status_vps (zelda) ---
    - name: Status page files
      ansible.builtin.stat:
        path: "{{ item }}"
      register: verify_status_files
      loop:
        - /etc/gatus/env
        - /etc/caddy/Caddyfile
        - /etc/containers/systemd/gatus.container
        - /etc/containers/systemd/caddy.container
        - /opt/status/config.yaml
        - /opt/status/assets/logo.svg
      when: inventory_hostname == 'zelda'

    - name: Status page files exist and secrets are private
      ansible.builtin.assert:
        that:
          - verify_status_files.results | map(attribute='stat.exists') | min
          - verify_status_files.results[0].stat.mode == '0600'
        quiet: true
      when: inventory_hostname == 'zelda'

    - name: Read Quadlet units and Caddyfile
      ansible.builtin.slurp:
        src: "{{ item }}"
      register: verify_status_units
      loop:
        - /etc/containers/systemd/gatus.container
        - /etc/containers/systemd/caddy.container
        - /etc/caddy/Caddyfile
      when: inventory_hostname == 'zelda'

    - name: Images are pinned by digest, Caddy serves status.sogeor.com
      ansible.builtin.assert:
        that:
          - (verify_status_units.results[0].content | b64decode) is search('Image=ghcr\.io/twin/gatus:v[0-9.]+@sha256:[a-f0-9]{64}')
          - (verify_status_units.results[1].content | b64decode) is search('Image=docker\.io/library/caddy:[0-9.]+@sha256:[a-f0-9]{64}')
          - "'DropCapability=all' in (verify_status_units.results[0].content | b64decode)"
          - "'status.sogeor.com {' in (verify_status_units.results[2].content | b64decode)"
        quiet: true
      when: inventory_hostname == 'zelda'
