# Runs site.yml and status.yml against containers that mirror the servers:
# odin (Debian 13, control_plane) and zelda (Ubuntu 24.04, status).
dependency:
  name: galaxy
  enabled: false # collections are installed by CI from requirements.yml
driver:
  name: docker
platforms:
  - name: odin
    groups: [control_plane]
    image: sogeor-molecule-debian13
    dockerfile: Dockerfile.debian13
    pre_build_image: false
    override_command: false
    privileged: true
    cgroupns_mode: host
    volumes: ["/sys/fs/cgroup:/sys/fs/cgroup:rw"]
    tmpfs: [/run, /tmp]
  - name: zelda
    groups: [status]
    image: sogeor-molecule-ubuntu2404
    dockerfile: Dockerfile.ubuntu2404
    pre_build_image: false
    override_command: false
    privileged: true
    cgroupns_mode: host
    volumes: ["/sys/fs/cgroup:/sys/fs/cgroup:rw"]
    tmpfs: [/run, /tmp]
provisioner:
  name: ansible
  env:
    # No SOPS keys in tests: load plain group_vars and host_vars only.
    ANSIBLE_VARS_ENABLED: host_group_vars
  inventory:
    links:
      group_vars: ../../inventory/group_vars/
      host_vars: host_vars/
verifier:
  name: ansible
